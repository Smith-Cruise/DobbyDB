# Lakelet configuration demo.
# Copy this file, adjust the values, and pass it via `--config <path>`.
# All keys use kebab-case. Required fields are marked; everything else is optional.

# ---------------------------------------------------------------------------
# Server-wide settings.
# ---------------------------------------------------------------------------
[server]
# Optional. Caps the query engine memory usage.
# If omitted, defaults to 80% of the effective total system memory.
# Accepts a number with an optional unit suffix (case-insensitive):
# b, kb, mb, gb, tb. A bare number is treated as bytes. Example: "4GB".
# memory-limit = "4GB"
# Optional, default 32010. Port the Arrow Flight SQL server listens on when
# starting with `--flight-sql-server`.
# flight-sql-server-port = 32010

# ---------------------------------------------------------------------------
# Glue catalogs. Repeat the [[catalog.glue]] block for each catalog.
# ---------------------------------------------------------------------------
[[catalog.glue]]
# Required. Unique catalog name used in SQL (e.g. `use catalog glue_catalog;`).
name = "glue_catalog"
# Optional. AWS region of the Glue metastore.
aws-glue-region = "us-west-2"
# Optional. Static credentials for Glue. If omitted, the default AWS
# credential chain (env vars, profile, IAM role, ...) is used.
aws-glue-access-key = "ak"
aws-glue-secret-key = "sk"
# Optional. Object-store credentials used to read the underlying table data.
# Provide an `s3-storage` block for s3:// / s3a:// locations; omit it to use
# the default AWS credential chain.
s3-storage = { region = "us-west-2", access-key = "ak", secret-key = "sk" }

# ---------------------------------------------------------------------------
# Hive Metastore (HMS) catalogs. Repeat the block for each catalog.
# ---------------------------------------------------------------------------
[[catalog.hms]]
# Required. Unique catalog name used in SQL.
name = "hms_1"
# Required. Thrift metastore address as host:port.
metastore-uri = "127.0.0.1:9087"
# Optional storage credentials, matched by the table location scheme:
#   s3:// or s3a://  -> s3-storage
#   oss://           -> oss-storage
#   hdfs://          -> no storage config needed (the NameNode host:port is
#                       taken from the table location authority)
#
# Without a block, the backend's own credential chain is used (env vars,
# profile, instance metadata); s3 then needs AWS_REGION in the environment,
# and oss always needs at least an endpoint.
#
# s3-storage keys (all optional):
#   region, endpoint, access-key, secret-key, path-style-access (bool, default false)
# s3-storage = { endpoint = "http://127.0.0.1:9000", region = "us-east-1", access-key = "admin", secret-key = "password", path-style-access = true }
#
# oss-storage keys (endpoint required, the rest optional):
#   endpoint, access-key, secret-key, path-style-access (bool, default false)
# The endpoint must be the bare regional endpoint WITHOUT the bucket name.
# oss-storage = { endpoint = "https://oss-cn-hangzhou.aliyuncs.com", access-key = "ak", secret-key = "sk", path-style-access = false }

# ---------------------------------------------------------------------------
# Paimon filesystem catalogs. Repeat the [[catalog.paimon-fs]] block for each
# warehouse. Serves Paimon tables only; metadata is read directly from the
# warehouse directory (layout: warehouse/<database>.db/<table>).
# ---------------------------------------------------------------------------
# [[catalog.paimon-fs]]
# Required. Unique catalog name used in SQL.
# name = "paimon_fs_1"
# Required. Warehouse root path: an object-store path (s3://bucket/warehouse)
# or a local file:// URI (file:///data/paimon/warehouse).
# warehouse = "s3://bucket/warehouse"
# Optional storage credentials, matched by the warehouse path scheme, same
# keys as the HMS/Glue storage blocks above. A local warehouse needs none.
# s3-storage = { endpoint = "http://127.0.0.1:9000", region = "us-east-1", access-key = "admin", secret-key = "password", path-style-access = true }

# ---------------------------------------------------------------------------
# Iceberg REST catalogs. Repeat the [[catalog.iceberg-rest]] block for each
# service. Read-only: queries and metadata tables, no writes.
# ---------------------------------------------------------------------------
# [[catalog.iceberg-rest]]
# Required. Unique catalog name used in SQL.
# name = "iceberg_rest"
# Required. HTTP(S) base URL, without credentials or query parameters.
# uri = "https://catalog.example.com"
# Optional. Warehouse identifier, passed unchanged to the service.
# warehouse = "warehouse_name"
# Optional. Bearer token for authenticating requests to the REST service.
# token = "<REST catalog access token>"
# Optional storage credentials, used in preference to any the REST catalog
# vends. Without a block for a location scheme, credentials vended by the
# server serve that scheme, and failing that the backend's own credential
# chain (env vars, profile, instance metadata).
# s3-storage = { region = "us-east-1", access-key = "ak", secret-key = "sk" }